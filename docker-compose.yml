services:
  api:
    build: .
    container_name: url-shortener-api
    env_file:
      - .docker.env
    ports:
      - "8002:8001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: url-shortener-postgres
    env_file:
      - .docker.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arturo_api -d url_shortener"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
